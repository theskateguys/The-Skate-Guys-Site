<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">Temporary TSG logo keychain mockup</title>
  <desc id="desc">Acrylic keychain mockup using The Skate Guys logo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#050508"/>
      <stop offset="1" stop-color="#131321"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="900" height="900" fill="url(#bg)"/>
  <circle cx="450" cy="188" r="58" fill="none" stroke="#cfd2df" stroke-width="22"/>
  <path d="M450 246v76" stroke="#cfd2df" stroke-width="26" stroke-linecap="round"/>
  <rect x="250" y="316" width="400" height="330" rx="78" fill="#0e1019" stroke="#00f5ff" stroke-opacity=".5" stroke-width="10" filter="url(#shadow)"/>
  <rect x="290" y="356" width="320" height="250" rx="46" fill="#050508" stroke="#ffffff" stroke-opacity=".08"/>
  <image href="../logo.png" x="318" y="390" width="264" height="182" preserveAspectRatio="xMidYMid meet"/>
  <text x="450" y="720" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="4">ACRYLIC KEYCHAIN</text>
  <text x="450" y="758" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ff2d6b" letter-spacing="3">TEMP PRODUCT MOCKUP</text>
</svg>
