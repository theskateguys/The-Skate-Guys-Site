<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">Temporary TSG logo T-shirt mockup</title>
  <desc id="desc">Black T-shirt mockup with The Skate Guys logo on a dark studio background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#08080f"/>
      <stop offset=".48" stop-color="#121220"/>
      <stop offset="1" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#222432"/>
      <stop offset=".55" stop-color="#0f1018"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="900" height="900" fill="url(#bg)"/>
  <circle cx="190" cy="160" r="170" fill="#00f5ff" opacity=".08"/>
  <circle cx="730" cy="760" r="210" fill="#ff2d6b" opacity=".08"/>
  <path d="M252 205 355 142h190l103 63 130 86-74 130-93-49v342c0 34-27 61-61 61H350c-34 0-61-27-61-61V372l-93 49-74-130 130-86Z" fill="url(#cloth)" filter="url(#shadow)"/>
  <path d="M355 142c18 58 55 88 95 88s77-30 95-88" fill="none" stroke="#343746" stroke-width="24" stroke-linecap="round"/>
  <path d="M295 375v310c0 28 22 50 50 50h210c28 0 50-22 50-50V375" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="3"/>
  <rect x="315" y="340" width="270" height="220" rx="26" fill="#050508" opacity=".72"/>
  <image href="../logo.png" x="335" y="360" width="230" height="180" preserveAspectRatio="xMidYMid meet"/>
  <text x="450" y="628" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800" fill="#ffffff" letter-spacing="4">TSG CREW</text>
  <text x="450" y="666" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#00f5ff" letter-spacing="3">TEMP MOCKUP</text>
</svg>
